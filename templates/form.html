<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class="form-card">
    <h2>Why was I not selected?</h2>

    <form method="POST" action="/submit">
        <input type="hidden" name="req_id" value="{{ req_id }}">

        <div class="radio-group">
            <label><input type="radio" name="reason" value="experience" required> Not enough experience</label>
            <label><input type="radio" name="reason" value="better_candidate"> Better candidate</label>
            <label><input type="radio" name="reason" value="salary"> Salary mismatch</label>
            <label><input type="radio" name="reason" value="stack"> Tech stack mismatch</label>
            <label><input type="radio" name="reason" value="other"> Other</label>
        </div>

        <textarea name="comment" maxlength="1000" placeholder="Optional feedback"></textarea>

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
